<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      LG webOS renders at a fixed 1920x1080. `user-scalable=no` stops the remote's
      pointer mode from pinch-zooming the UI out of alignment.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Weblink</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* Boot background = the LIGHT theme's background (the app default).
           ThemeProvider re-syncs this on every scheme change. */
        background: #f5f2ee;
        overflow: hidden;
        /*
          The document-wide sans-serif default. This is load-bearing on the TV,
          not a nicety: react-native-web's <Text> sets NO font-family of its own,
          so every string that does not pass an explicit `fontFamily` inherits
          from here. With this rule absent the inherited value is webOS
          Chromium's "standard" font, which is a SERIF — which is why untouched
          text came out serif in the .ipk while FONT-styled text did not.

          Keep this list in sync with SANS in src/components/TvGlass/TvGlass.tsx.
          The spec families (SF Pro, Inter) are all absent on webOS, so the TV
          falls through to LG's own UI sans; desktop dev still resolves the
          spec families first.
        */
        font-family: 'SF Pro Display', 'SF Pro Text', Inter, 'Helvetica Neue', 'Segoe UI', Roboto,
          'LG Smart UI', 'Museo Sans', SamsungOne, Arial, sans-serif;
      }
      #root {
        display: flex;
        height: 100%;
      }
      /* react-native-web needs the root chain to be a flex column to fill the TV. */
      #root > div {
        flex: 1;
      }
      /* The app draws its own amber focus rings; the UA outline double-draws them. */
      *:focus {
        outline: none;
      }
      /*
        Ten-foot scale.

        webOS lays the app out across the full 1920px surface, so the phone-scale
        type the components were authored at (12-16px) is both tiny and soft from
        a sofa. NativeWind compiles to px values in JS, not rem, so there is no
        root font-size lever — `zoom` is the one knob that scales everything.

        `zoom` is a LAYOUT scale: the browser re-flows at 1280 CSS px and then
        rasterises text at the full 1920 device resolution, so glyphs come out
        crisp. `transform: scale()` would rasterise first and then stretch the
        bitmap, which is exactly what makes text look blurry — do not swap it.

        Tune this single number to make the whole UI bigger or smaller. The
        min-width guard keeps a small desktop dev window usable.
      */
      @media (min-width: 1600px) {
        :root {
          zoom: 1.5;
        }
      }
    </style>
    <% if (tvTarget === 'tizen') { %>
    <!--
      Samsung's product API (`webapis`: DUID, ...). $WEBAPIS is resolved by the
      TV's web runtime; it exists only on a Samsung TV / emulator, so the webOS
      build never includes this tag. Loaded before the bundle (which is injected
      at the end of <body>) so the global is ready when the app starts.
    -->
    <script src="$WEBAPIS/webapis/webapis.js"></script>
    <% } %>
  </head>
  <body>
    <div id="root"></div>
    <!--
      A TV has no reachable console: on webOS you would need `ares-inspect` over
      the network just to read a stack trace, and a startup crash otherwise shows
      as an indistinguishable black screen. This paints the error onto the screen
      instead. It only ever becomes visible if something actually threw.
    -->
    <script>
      (function () {
        function show(title, detail) {
          var el = document.getElementById('boot-error');
          if (!el) {
            el = document.createElement('pre');
            el.id = 'boot-error';
            el.style.cssText =
              'position:fixed;inset:0;z-index:9999;margin:0;padding:24px;overflow:auto;' +
              'background:#0d0d0d;color:#ef4444;font:14px/1.5 monospace;white-space:pre-wrap';
            document.body.appendChild(el);
          }
          el.textContent += title + '\n' + detail + '\n\n';
        }
        window.addEventListener('error', function (e) {
          show(
            e.message || 'Script error',
            (e.filename || '') + ':' + (e.lineno || 0) + '\n' + ((e.error && e.error.stack) || ''),
          );
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason || {};
          show('Unhandled rejection: ' + (r.message || r), r.stack || '');
        });
      })();
    </script>
  </body>
</html>
