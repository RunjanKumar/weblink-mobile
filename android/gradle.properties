# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true

android.useAndroidX=true

# Architectures to build native code for. Keep ALL FOUR.
#
# armeabi-v7a is NOT optional: budget Android tablets (and anything pre-2019 on
# Android 10 and below) are 32-bit ARM. Dropping it does not produce a clean
# "unsupported device" - react-native's own libs ship prebuilt for every ABI, so
# lib/armeabi-v7a still exists in the APK and the device installs happily, then
# crashes at launch with UnsatisfiedLinkError because the locally-compiled libs
# (reanimated, worklets, rnscreens, mmkv) are missing for that ABI only.
#
# On Windows the reanimated C++ step generates depfile paths ~2x the project path
# length and overflows the 260-char MAX_PATH that the SDK's ninja 1.10.2 cannot
# address. Do not fix that by deleting an ABI - build via scripts/build-apk.ps1,
# which substs the project onto a drive root so the paths stay short.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture (Fabric/TurboModules). Kept OFF for maximum third-party
# library stability on this first build (react-native-mmkv v2 supports old arch).
# Flip to true only after validating all native deps under the New Architecture.
newArchEnabled=false

# Use Hermes JS engine.
hermesEnabled=true
