# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true

android.useAndroidX=true

# Architectures to build native code for.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture (Fabric/TurboModules). Kept OFF for maximum third-party
# library stability on this first build (react-native-mmkv v2 supports old arch).
# Flip to true only after validating all native deps under the New Architecture.
newArchEnabled=false

# Use Hermes JS engine.
hermesEnabled=true
